name: Deploy Workflow

on:
  repository_dispatch:
    types: [deploy_pr_request]  # Listen for this custom event

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.client_payload.pr_number }}/head

      - name: Show Inputs
        run: |
          echo "Triggered by PR #${{ github.event.client_payload.pr_number }}"
          echo "Comment Author: ${{ github.event.client_payload.comment_author }}"

      - name: Deploy Application
        run: |
          echo "Deploying application for PR #${{ github.event.client_payload.pr_number }}..."
